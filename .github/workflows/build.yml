name: Build ru-RU frontend and backend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "DEEIX Chat release tag to build (must match the version running on your server)"
        required: true
        default: "v0.4.4-beta.4"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream and apply the ru-RU add-on
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git clone --depth 1 --branch "$TAG" https://github.com/DEEIX-AI/deeix-chat src
          tar -xzf deeix-ru-addon.tar.gz
          bash deeix-ru-addon/install.sh src

      - name: Build the frontend with the official Dockerfile
        run: docker build --target frontend-builder -t deeix-ru-frontend src

      - name: Extract the static site
        run: |
          docker create --name extract-frontend deeix-ru-frontend
          docker cp extract-frontend:/src/apps/web/out ./out
          docker rm extract-frontend
          test -f out/index.html
          du -sh out

      - uses: actions/upload-artifact@v4
        with:
          name: deeix-ru-out
          path: out
          if-no-files-found: error

      - name: Build the backend with the official Dockerfile
        env:
          TAG: ${{ inputs.tag }}
        run: docker build --target backend-builder --build-arg GIT_COMMIT="$TAG" -t deeix-ru-backend src

      - name: Extract the backend binary
        run: |
          docker create --name extract-backend deeix-ru-backend
          docker cp extract-backend:/out/deeix-chat ./deeix-chat
          docker rm extract-backend
          chmod +x deeix-chat
          ls -la deeix-chat

      - uses: actions/upload-artifact@v4
        with:
          name: deeix-ru-backend
          path: deeix-chat
          if-no-files-found: error
